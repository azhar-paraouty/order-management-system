<!DOCTYPE html>
<html>
  <head>
    <title>Order Status</title>
    <link rel="stylesheet" href="../css/order_status.css">
    <link rel="stylesheet" href="../css/style.css">
  </head>

  <body>
    <div class="layout">
      <aside class="left_panel">
        <h2 id="welcome_staff">Welcome, Desk Staff</h2>
        <hr class="horizontal_lines">
      </aside>

      <main class="middle_panel">
        <h1 class="page_title">Status Dashboard</h1>

        <!-- Header -->
        <div class="header">
          <div class="logo">
            Logo
          </div>

          <div class="search">
            <input type="text" name="search_order" placeholder="Search Orders">
          </div>

          <div class="filter">
            <button id="filter_button">Filter</button>
          </div>
        </div>

        <hr class="horizontal_lines">

        <!-- Orders and their current states -->
        <section class="orders">

          <div class="order_row">
            <div class="order_card">
              <h3>Order #001</h3>
              <p>Customer: John</p>
              <p>3 Items</p>
              <p>Status:</p>
              <div class="states">
                <span>Pending</span>
                <span>Cooking</span>
                <span>Ready</span>
                <span>Delivered</span>
              </div>
            </div>

            <div class="order_options">
              <button class="deliver_btn">DELIVER</button>
              <button class="cancel_btn">CANCEL</button>
            </div>
          </div>

          <hr class="horizontal_lines">

          <div class="order_row">
            <div class="order_card">
              <h3>Order #002</h3>
              <p>Customer: Sarah</p>
              <p>2 Items</p>
              <p>Status:</p>
              <div class="states">
                <span>Pending</span>
                <span>Cooking</span>
                <span>Ready</span>
                <span>Delivered</span>
              </div>
            </div>

            <div class="order_options">
              <button class="deliver_btn">DELIVER</button>
              <button class="cancel_btn">CANCEL</button>
            </div>
          </div>

          <hr class="horizontal_lines">

        </section>
      </main>
    </div>
  </body>
</html>
